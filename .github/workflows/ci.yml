name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      - name: Type-check all modules, examples and fixtures
        run: |
          deno check mod.ts codec.ts codecs.ts core/ examples/ test_fixtures/

      - name: Lint
        run: deno lint .

      - name: Format check
        run: deno fmt --check .

      - name: Run tests
        # --allow-run/--allow-env: process-actor tests (spawnProcess) launch a
        # child deno process via node:child_process fork IPC. --allow-net:
        # WebSocket end-to-end test binds a local server.
        run: deno test --allow-read --allow-run --allow-env --allow-net

      - name: Run tests with GC forced (FinalizationRegistry paths)
        run: deno test --allow-read --allow-run --allow-env --allow-net --v8-flags=--expose-gc
