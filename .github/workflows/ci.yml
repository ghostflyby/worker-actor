name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      - name: Type-check all modules, examples and fixtures
        run: |
          deno check mod.ts codec.ts channel.ts rpc.ts stream.ts codecs.ts types.ts protocol.ts core/ examples/ test_fixtures/

      - name: Lint
        run: deno lint .

      - name: Format check
        run: deno fmt --check .

      - name: Run tests
        run: deno test --allow-read

      - name: Run tests with GC forced (FinalizationRegistry paths)
        run: deno test --allow-read --v8-flags=--expose-gc
